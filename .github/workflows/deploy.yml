name: Deploy SIT File App to Hostinger

on:
  push:
    branches: [sit/php/v3]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point SIT paths
        run: |
          sed -i 's|RewriteBase /file-app/|RewriteBase /sit/file-app/|' .htaccess
          # Force noindex for SIT
          if ! grep -q 'noindex' index.html; then
            sed -i 's|<meta name="viewport"|<meta name="robots" content="noindex, nofollow" />\n    <meta name="viewport"|' index.html
          fi
          printf 'User-agent: *\nDisallow: /sit/\nDisallow: /\n' > robots.txt

      - name: Build UI bundle
        run: |
          {
            echo "// Auto-built UI bundle"
            for f in modules/api.js modules/toast.js modules/modal.js modules/auth-gate.js modules/health-banner.js modules/upload.js modules/files.js modules/dragdrop.js script.js; do
              echo "/* ===== $f ===== */"
              cat "$f"
              echo
            done
          } > app.js

      - name: Verify FTP_HOST secret
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "FTP_HOST secret is empty"
            exit 1
          fi
          TRIMMED="$(printf '%s' "$FTP_HOST" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "FTP_HOST length=${#FTP_HOST} trimmed_length=${#TRIMMED}"
          if [ "$FTP_HOST" != "$TRIMMED" ]; then
            echo "FTP_HOST has leading/trailing whitespace or newlines"
            exit 1
          fi
          getent hosts "$FTP_HOST" || {
            echo "DNS lookup failed for FTP_HOST"
            exit 1
          }

      # SamKirkland/FTP-Deploy-Action dies with ECONNRESET on Hostinger while
      # creating folders. lftp reconnects and resumes across socket resets.
      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 20;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set net:timeout 30;
            set mirror:parallel-transfer-count 1;
            set mirror:set-permissions false;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mkdir -p sit/file-app;
            # Remove any previously uploaded git metadata from the server
            rm -r -f sit/file-app/.git;
            rm -f sit/file-app/.gitignore;
            mirror -R --verbose --continue --only-newer --no-perms \
              --exclude '(^|/)\\.git(/|$)' \
              --exclude '(^|/)\\.github(/|$)' \
              --exclude '(^|/)\\.gitignore$' \
              --exclude '(^|/)uploads(/|$)' \
              --exclude '(^|/)chunks(/|$)' \
              --exclude '(^|/)storage/uploads(/|$)' \
              --exclude '(^|/)storage/chunks(/|$)' \
              --exclude '(^|/)rate_limit(/|$)' \
              --exclude '(^|/)throttle(/|$)' \
              --exclude '(^|/)tokens(/|$)' \
              --exclude '(^|/)node_modules(/|$)' \
              --exclude '(^|/)docs(/|$)' \
              --exclude '(^|/)README\\.md$' \
              --exclude '(^|/)LICENSE$' \
              ./ sit/file-app/;
            bye
          "
