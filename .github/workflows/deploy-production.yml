name: Deploy Production File App to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify FTP_HOST secret
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "FTP_HOST secret is empty"
            exit 1
          fi
          TRIMMED="$(printf '%s' "$FTP_HOST" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "FTP_HOST length=${#FTP_HOST} trimmed_length=${#TRIMMED}"
          if [ "$FTP_HOST" != "$TRIMMED" ]; then
            echo "FTP_HOST has leading/trailing whitespace or newlines"
            exit 1
          fi
          getent hosts "$FTP_HOST" || {
            echo "DNS lookup failed for FTP_HOST"
            exit 1
          }

      - name: Deploy via lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:max-retries 20;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set net:timeout 30;
            set mirror:parallel-transfer-count 1;
            set mirror:set-permissions false;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mkdir -p file-app;
            mirror -R --verbose --continue --only-newer --no-perms \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob config.php \
              --exclude-glob uploads/ \
              --exclude-glob chunks/ \
              --exclude-glob rate_limit/ \
              --exclude-glob throttle/ \
              --exclude-glob tokens/ \
              --exclude-glob node_modules/ \
              --exclude-glob docs/ \
              --exclude-glob README.md \
              --exclude-glob LICENSE \
              --exclude-glob .gitignore \
              ./ file-app/;
            bye
          "
