<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2> File Upload</h2>
        <div class="card">
            <div class="drop-zone" id="dropZone">
                <label id="dropContent" for="fileInput" class="drop-content">
                    <p>Tap or Drag file</p>
                    <p>Click to select</p>
                </label>
            </div>
            <input type="file" id="fileInput" class="file-input visually-hidden">
            <br>
            <div class="btn-group">
                <button class="btn upload" onclick="UploadModule.start()">Upload</button>
                <button class="btn pause" onclick="UploadModule.pause()">Pause</button>
                <button class="btn resume" onclick="UploadModule.resume()">Resume</button>
                <button class="btn cancel" onclick="UploadModule.cancel()">Cancel</button>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <p id="status"></p>
        </div>

        <div class="card file-list">
            <h3>Files</h3>
            <ul id="fileList">

            </ul>
        </div>

    </div>
    <script src="script.js?v=1.0.1"></script>
</body>

</html>
