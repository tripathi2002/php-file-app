<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>File Upload</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d98d8'/%3E%3Cpath d='M16 8v12M10 14l6 6 6-6' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="style.css?v=1.3.0" />
  </head>

  <body>
    <div id="healthBanner" class="health-banner" hidden></div>

    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main" class="container">
      <header class="app-header">
        <h1>Files</h1>
        <button
          type="button"
          id="keyBtn"
          class="key-btn"
          title="Access key"
          aria-label="Set access key"
        >
          Key
        </button>
      </header>

      <section class="quota-card" aria-label="Storage usage">
        <div class="quota-track">
          <div id="quotaBar" class="quota-bar"></div>
        </div>
        <p id="quotaLabel" class="quota-label">Storage usage</p>
      </section>

      <section class="card file-list" aria-label="Uploaded files">
        <ul id="fileList"></ul>
      </section>
    </main>

    <button type="button" id="fab" class="fab" aria-label="Open upload panel">+</button>

    <div
      class="overlay"
      id="overlay"
      role="dialog"
      aria-modal="true"
      aria-label="Upload file"
    >
      <div class="bottom-sheet upload-box" id="uploadBox">
        <div class="card">
          <div class="drop-zone" id="dropZone">
            <label id="dropContent" for="fileInput" class="drop-content">
              <p>Tap or Drag file</p>
              <p>Click to select</p>
            </label>
          </div>
          <input
            type="file"
            id="fileInput"
            class="file-input visually-hidden"
            accept=".jpg,.jpeg,.png,.gif,.webp,.ico,.pdf,.mp4,.webm,.mp3,.wav,.ogg,.m4a,.zip,.txt,.csv,.json,.md,.doc,.docx,.xls,.xlsx,.ppt,.pptx"
          />
          <br />
          <div class="btn-group">
            <button type="button" id="startUploadBtn" class="btn upload" disabled>
              Upload
            </button>
            <button type="button" id="pauseUploadBtn" class="btn pause" disabled>
              Pause
            </button>
            <button type="button" id="resumeUploadBtn" class="btn resume" disabled>
              Resume
            </button>
            <button type="button" id="cancelUploadBtn" class="btn cancel" disabled>
              Cancel
            </button>
          </div>

          <div class="progress" aria-hidden="true">
            <div class="progress-bar" id="progressBar"></div>
          </div>

          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <script src="app.js?v=1.3.0"></script>
  </body>
</html>
