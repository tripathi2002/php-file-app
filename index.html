<!DOCTYPE html>
<html>
<head>
    <title>Chunk Upload</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
        }

        .box {
            border: 2px dashed #ccc;
            padding: 30px;
            text-align: center;
        }

        .progress {
            margin-top: 20px;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .file-list {
            margin-top: 30px;
        }
    </style>
</head>
<body>

<h2>📤 Chunk File Upload</h2>

<div class="box">
    <input type="file" id="fileInput" />
    <br><br>
    <button onclick="startUpload()">Upload</button>
</div>

<div class="progress">
    <div class="progress-bar" id="progressBar"></div>
</div>

<p id="status"></p>

<div class="file-list">
    <h3>Uploaded Files</h3>
    <ul id="fileList"></ul>
</div>

<script>
async function startUpload() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return alert("Select file");

    const chunkSize = 5 * 1024 * 1024;
    const totalChunks = Math.ceil(file.size / chunkSize);

    const progressBar = document.getElementById("progressBar");
    const status = document.getElementById("status");

    for (let i = 0; i < totalChunks; i++) {
        const chunk = file.slice(i * chunkSize, (i + 1) * chunkSize);

        const formData = new FormData();
        formData.append("file", chunk);
        formData.append("chunkIndex", i);
        formData.append("totalChunks", totalChunks);
        formData.append("fileName", file.name);

        await fetch("upload-chunk.php", {
            method: "POST",
            body: formData
        });

        const percent = Math.floor(((i + 1) / totalChunks) * 100);
        progressBar.style.width = percent + "%";
        status.innerText = `Uploading... ${percent}%`;
    }

    // merge request
    await fetch("merge.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            fileName: file.name,
            totalChunks
        })
    });

    status.innerText = "✅ Upload Complete";
    progressBar.style.width = "100%";

    loadFiles();
}

// Load uploaded files
async function loadFiles() {
    const res = await fetch("list.php");
    const files = await res.json();

    const list = document.getElementById("fileList");
    list.innerHTML = "";

    files.forEach(file => {
        const li = document.createElement("li");
        li.innerHTML = `
            ${file} |
            <a href="uploads/${file}" target="_blank">View</a> |
            <a href="download.php?file=${file}">Download</a>
        `;
        list.appendChild(li);
    });
}

// initial load
loadFiles();
</script>

</body>
</html>
